[package]
license = "MIT"
name = "bitsov-app"
version = "0.0.1"
edition = "2021"
description = "BitSov — the sovereign conversational client (desktop shell)"
default-run = "bitsov-app"

[lib]
name = "bitsov_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ring = "0.17"
tauri = { version = "2", features = [] }
tauri-plugin-barcode-scanner = { version = "=2.5.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Read the supervised node's routing policy without linking node crates.
toml = "1.1"
tokio = { version = "1", features = ["time", "rt", "macros", "net", "sync", "io-util"] }
# Control center live events: the HOST reads the node's loopback `/ws` and forwards
# parsed events to the main window. Plain `ws://127.0.0.1` only — no TLS feature,
# and the renderer never opens a socket or sees the token (Gate G2).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Pairing client (#77 ceremony, src/pairing): the app-held Ed25519 client key, the
# node's BLAKE3 short-code derivation for the tripwire, and a CSPRNG for the seed.
ed25519-dalek = "2"
blake3 = "1"
bip39 = { version = "2.2.2", default-features = false, features = ["std"] }
getrandom = "0.2"
hex = "0.4"
tempfile = "3"
base64 = "0.22"
zeroize = { version = "1", features = ["serde"] }
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Call sealing (src/control/call_seal.rs), only with the `call-seal` feature. Same version the Noise tunnel already locks.
chacha20poly1305 = { version = "0.10", optional = true }
# Decode BOLT 11 invoices exactly as the node's payment path does (genome
# dac01c8 locks lightning-invoice 0.34.1 via ldk-node 0.7.0). Keep in lockstep.
lightning-invoice = "=0.34.1"

# GATE G1 (docs/ARCHITECTURE_BOUNDARY.md): NO konsensus-* dependency here — the node
# is a bundled BINARY (see tauri.conf.json `externalBin`), never a linked crate. A
# konsensus-* path/git dep in this file fails scripts/authority-check.sh.

# SIGTERM is Unix-only; the Windows stop path uses TerminateProcess via kill().
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Desktop-only process supervision, sidecar launch, and native file dialog.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
bitsov-ffi = { path = "ffi" }
shared_child = "1.1"
tauri-plugin-shell = "2"
rfd = "0.15"

# Local notifications (official Tauri 2 plugin): owner approvals and calls on the
# Mac, ordinary message notifications on the Mac, Windows and Linux.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-notification = "=2.8.1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

# iOS uses the same safe Apple enclave bridge, without desktop supervision.
[target.'cfg(target_os = "ios")'.dependencies]
bitsov-ffi = { path = "ffi" }

# Pairing QR scan on both mobile targets (mobile-capabilities grants its permissions).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"

[features]
default = []
# Headless hardware tests only; the native bridge rejects this in release builds.
native-test-keys = ["bitsov-ffi/native-test-keys"]
# Lets the host toolchain compile the pure-client cfg path before mobile SDKs
# are installed. Tauri mobile targets select the same path through `cfg(mobile)`.
mobile = ["bitsov-ffi/mobile", "dep:tauri-plugin-barcode-scanner"]
# Opt-in on macOS with BITSOV_LOCAL_OWNER_CEREMONY=1; bundled rc9 supports #237.
local-owner-ceremony = []
# Mock-only SIT reader example. Pulls in `mock-node`; not part of the app binary.
sit-mock = ["dep:mock-node"]
# DEV ONLY (src/dev_node.rs, docs/DEV_NODE_FROM_MAIN.md): run an UNVERIFIED local
# `konsensus` via BITSOV_DEV_SIDECAR instead of the signature-verified sidecar.
# A compile error in release builds. Never add this to `default`.
dev-node = []
# Sealed call audio, a test build only (src/control/call_seal.rs). Off by default.
# Build with VITE_CALL_SEAL=sealed as well: build.rs refuses one without the other.
# Without it, no seal command, permission, capability or direct dependency exists.
call-seal = ["dep:chacha20poly1305", "blake3/zeroize", "x25519-dalek/zeroize"]

[dependencies.mock-node]
path = "crates/mock-node"
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# `tauri::test` (MockRuntime + IPC) is feature-gated. Cargo enables this for
# `cargo test` only; `cargo check` / `cargo build` keep the default features.
tauri = { version = "2", features = ["test"] }
# In-process stand-in for broker tests. The app binary does not link this.
mock-node = { path = "crates/mock-node" }

[[example]]
name = "jarvis_sit_mock"
required-features = ["sit-mock"]

# Jarvis Phase 1 test bed. The app binary does not link it. `cargo test`
# in this directory builds it, and the broker tests above use it in-process.
[workspace]
members = [".", "crates/mock-node", "ffi"]
default-members = [".", "crates/mock-node", "ffi"]
resolver = "2"
