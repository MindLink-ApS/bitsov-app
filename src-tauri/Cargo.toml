[package]
name = "bitsov-app"
version = "0.0.1"
edition = "2021"
description = "BitSov — the sovereign conversational client (desktop shell)"
default-run = "bitsov-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "macros"] }

# GATE G1 (docs/ARCHITECTURE_BOUNDARY.md): NO konsensus-* dependency here — the node
# is a bundled BINARY (see tauri.conf.json `externalBin`), never a linked crate. A
# konsensus-* path/git dep in this file is an automatic G1 FAIL (CODEX_APP_AUTHORITY.md §G).
