[package]
license = "MIT"
name = "bitsov-ffi"
version = "0.0.1"
edition = "2021"
description = "Safe wrappers around BitSov desktop native interfaces"
publish = false

[features]
default = []
# Forwarded by bitsov-app's host-toolchain mobile check. This keeps that check
# independent of Xcode even though Cargo is targeting the macOS host.
mobile = []
# Opt-in for headless hardware tests; rejected by release builds.
native-test-keys = []

[dependencies]
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Owner-only private files and current-user DPAPI (src/win_private.rs, src/dpapi.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
ring = "0.17"
