[package]
license = "MIT"
name = "bitsov-mcp"
version = "0.0.1"
edition = "2021"
publish = false
description = "Connects an AI client (MCP over stdio) to the BitSov app's local endpoint"

[lib]
name = "bitsov_mcp"
path = "src/lib.rs"

[[bin]]
name = "bitsov-mcp"
path = "src/main.rs"

[dependencies]
bitsov-mcp-wire = { path = "../mcp-wire" }
getrandom = "0.4"
hex = "0.4"
serde_json = "1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the owner-only pipe client and private files (no native bridges on Windows).
[target.'cfg(windows)'.dependencies]
bitsov-ffi = { path = "../../ffi" }

[dev-dependencies]
tempfile = "3"
