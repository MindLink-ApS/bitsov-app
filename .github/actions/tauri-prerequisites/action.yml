name: Tauri Linux prerequisites
description: Cache apt downloads; retain apt signature and package verification
runs:
  using: composite
  steps:
    - name: Identify runner image
      id: image
      shell: bash
      run: echo "version=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
    - name: Cache Tauri debs
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        # Exclude apt's root/_apt-owned lock and partial directory.
        path: ${{ runner.temp }}/tauri-apt/*.deb
        key: tauri-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-${{ hashFiles('scripts/ci/install-tauri-prerequisites.sh', 'scripts/ci/verify-apt-cache.py') }}
    - name: Install verified packages
      shell: bash
      run: bash scripts/ci/install-tauri-prerequisites.sh
