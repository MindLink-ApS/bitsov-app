name: Tauri Linux prerequisites
description: Cache apt downloads; retain apt signature and package verification
runs:
  using: composite
  steps:
    - name: Identify runner image
      id: image
      shell: bash
      run: |
        echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"
        echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"
    - name: Cache Tauri debs
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        # Exclude apt's root/_apt-owned lock and partial directory.
        path: ${{ runner.temp }}/tauri-apt/*.deb
        # The runner image version changes often; any earlier cache for this image family is a safe
        # starting point, because every restored archive is verified against apt's own signed index
        # (verify-apt-cache.py) and a mismatch is discarded and downloaded again.
        key: tauri-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ hashFiles('scripts/ci/install-tauri-prerequisites.sh', 'scripts/ci/verify-apt-cache.py') }}-${{ steps.image.outputs.version }}
        restore-keys: |
          tauri-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ hashFiles('scripts/ci/install-tauri-prerequisites.sh', 'scripts/ci/verify-apt-cache.py') }}-
          tauri-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-
    - name: Install verified packages
      shell: bash
      run: bash scripts/ci/install-tauri-prerequisites.sh
