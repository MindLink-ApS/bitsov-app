# Weekly version updates. Security updates are a separate repository setting.
# Only minor and patch updates are opened, grouped per ecosystem. Major versions
# are planned as deliberate changes, not automatic PRs.
# Tauri moves as one unit: its npm packages and Rust crates must share a
# major/minor release (the Tauri CLI refuses a mismatch) and some crates are
# pinned exactly, so Tauri version updates are done by hand across both
# ecosystems. The Tauri rules name the version-update types, so they do not
# hide Dependabot security updates for Tauri.
# Actions are pinned to full commit SHAs; Dependabot bumps the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "tauri-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
