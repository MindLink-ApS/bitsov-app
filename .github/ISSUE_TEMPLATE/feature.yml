name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a recovery phrase, private key, password, API token, pairing code or node configuration file here.**
        This tracker is public.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you would expect. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: This request contains no recovery phrase, key, password, token, pairing code or node configuration.
          required: true
