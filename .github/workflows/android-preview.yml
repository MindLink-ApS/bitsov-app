name: Android Preview

# One ARM64 debug APK, no emulator, distribution signing, or repository secrets.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/**'
      - 'third_party/fonts/**'
      - 'index.html'
      - 'assistant.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-preview:
    name: Android preview (debug APK; not a merge gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Match compileSdk and the locally verified NDK. SDK Manager installs
          # Google's packages; no separate third-party NDK installer is needed.
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;27.2.12479018'
          log-accepted-android-sdk-licenses: false
      - name: Select the pinned NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: tauri-preview-android-arm64
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      # Tauri merges tauri.android.conf.json, excluding the desktop sidecar.
      # Gradle uses its disposable debug key; no distribution key is configured.
      - name: Build Android debug preview
        run: npm run tauri -- android build --ci --debug --apk --target aarch64
      - name: Name the preview APK
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk)
          test "${#apks[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/preview"
          cp "${apks[0]}" "$RUNNER_TEMP/preview/BitSov-preview-android-arm64-$PREVIEW_SHA.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitsov-preview-android-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/preview/*-preview-*.apk
          if-no-files-found: error
          retention-days: 3
