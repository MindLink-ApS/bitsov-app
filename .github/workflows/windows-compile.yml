name: Windows Compile

# Split out of build.yml (job id, name and steps unchanged aside from the cache)
# so its triggers can differ from the Build merge gate.
#
# Platform-gating regression check (app #132): Windows is compile-only, not a
# supported runtime. Unix security checks stay intact; unsupported operations
# fail closed.
#
# CI cost: windows-latest is billed at 2× Linux. This does not run on every
# pull request or every push to main. It runs on the nightly schedule (default
# branch), on `v*` tags, on workflow_dispatch, and on a PR when `full-ci` is
# added or a full-ci PR gets a new commit (other labels do not rebuild). Required gates (Authority Check, Build) are unaffected.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

# contents: read only. A full-ci pull request runs this job; do not grant
# actions: write to that token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  windows-compile:
    # app #16 review: a Unix-only import (`shared_child::unix`) and an ungated
    # `send_signal` broke the Windows build, and Linux CI could not see it. The app
    # ships a Windows sidecar target, so the code must at least COMPILE there. This
    # cannot be checked from macOS — cross-compiling to MSVC needs a Windows C
    # toolchain (`ring`'s build script fails) — so it is checked on a Windows runner.
    #
    # NOT a merge gate: Windows is not a supported target today (unsigned, untested
    # package), and this job exists to catch platform-gating regressions, not to
    # promise Windows support. Keep it out of branch protection.
    name: Windows compile check (not a merge gate)
    runs-on: windows-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-check-windows
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache for Cargo
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - name: Placeholders for the tauri_build checks (sidecar + Windows icon)
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/bin
          : > "src-tauri/bin/konsensus-${TRIPLE}.exe"
          # tauri-build needs icons/icon.ico to emit a Windows Resource file, and the
          # repo has no Windows icon yet (app #18). This job checks that the RUST
          # compiles on Windows, so a throwaway icon is generated here rather than
          # committed — same pattern as the sidecar placeholder above. It is never
          # part of a release artifact.
          python3 - <<'PYICO'
          import struct
          png = open("src-tauri/icons/icon.png", "rb").read()
          # ICO container with a single PNG-compressed 256x256 entry.
          header = struct.pack("<HHH", 0, 1, 1)
          entry = struct.pack("<BBBBHHII", 0, 0, 0, 0, 1, 32, len(png), 6 + 16)
          open("src-tauri/icons/icon.ico", "wb").write(header + entry + png)
          print("placeholder icon.ico written")
          PYICO
      - name: cargo check (src-tauri)
        working-directory: src-tauri
        run: cargo check --locked
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
