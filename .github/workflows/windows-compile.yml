name: Windows Preview

# Unsigned preview installer, not a supported release or a merge gate.
# Keep the Windows runner limited to relevant PRs and explicit manual runs.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/**'
      - 'third_party/fonts/**'
      - 'index.html'
      - 'assistant.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'scripts/fetch-node-sidecar.sh'
      - '.github/workflows/windows-compile.yml'

# PR code only receives a read-only token; no repository secrets are used.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-compile:
    name: Windows preview (unsigned NSIS; not a merge gate)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: tauri-preview-windows
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          # The explicit stats step below is best-effort, including on startup failure.
          disable_annotations: true
      - name: Enable sccache for Cargo
        shell: bash
        run: |
          # Cache outages must cost time, not fail the build (app #280).
          # Keep the probed server alive; restarting during an outage can fail.
          export SCCACHE_IDLE_TIMEOUT=0
          export SCCACHE_GHA_ENABLED=true
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          if sccache --start-server; then
            {
              echo "SCCACHE_GHA_ENABLED=true"
              echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
              echo "RUSTC_WRAPPER=sccache"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable; compiling without a cache"
          fi
      - name: Fetch the signed sidecar and generate the Windows icon
        shell: bash
        env:
          # Automatic read-only token; no repository secret is configured.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/fetch-node-sidecar.sh
          npm run tauri -- icon src-tauri/icons/icon.png --output "$RUNNER_TEMP/preview-icons"
          cp "$RUNNER_TEMP/preview-icons/icon.ico" src-tauri/icons/icon.ico
      - name: Build unsigned NSIS preview
        shell: bash
        env:
          # beforeBundleCommand re-verifies the public sidecar before packaging.
          GH_TOKEN: ${{ github.token }}
        run: >-
          npm run tauri -- build --ci --no-sign --bundles nsis
          --config src-tauri/tauri.beta.conf.json
          --config '{"bundle":{"icon":["icons/icon.ico"]}}' -- --locked
      - name: Name the preview installer
        shell: pwsh
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/preview" | Out-Null
          Copy-Item $installers[0].FullName "$env:RUNNER_TEMP/preview/BitSov-preview-windows-x64-$env:PREVIEW_SHA-setup.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bitsov-preview-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/preview/*-preview-*-setup.exe
          if-no-files-found: error
          retention-days: 3
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
