name: Release / Udgivelse

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and verify without creating a release / Byg og verificér uden at oprette en udgivelse'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate version / Validér version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      dry-run: ${{ steps.metadata.outputs.dry-run }}
      updater: ${{ steps.updater.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release ref / Validér udgivelsesreference
        id: metadata
        env:
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
        run: python3 scripts/ci/release.py metadata
      - name: Updater eligibility / Opdateringsstatus
        id: updater
        env:
          ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: printf 'enabled=%s\n' "$ENABLED" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal / macOS til begge arkitekturer
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Toolchains / Værktøjer
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          command -v gpg || brew install gnupg
          npm ci --no-audit --no-fund
      - name: Authenticate both sidecars / Verificér begge nodebinærer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release-macos-sidecars.sh
      - name: Build, sign and notarize when configured / Byg, signér og notarbekræft efter opsætning
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          mode="$(python3 scripts/ci/release.py signing macos)"
          args=()
          if [ "$mode" = signed-notarized ]; then
            # Tauri's documented notarization variable is APPLE_PASSWORD.
            export APPLE_PASSWORD="$APPLE_APP_PASSWORD"
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD
            args+=(--no-sign)
          fi
          unset APPLE_APP_PASSWORD
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = {
              "build": {"beforeBundleCommand": "bash scripts/ci/release-macos-sidecars.sh --verify-only"},
              "bundle": {"externalBin": ["target/release-sidecar/konsensus"]},
          }
          Path("src-tauri/target/release-macos.conf.json").write_text(json.dumps(config))
          PY
          npm run tauri -- build --ci --target universal-apple-darwin --bundles app,dmg \
            --config src-tauri/target/release-macos.conf.json "${args[@]}" -- --locked
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/BitSov.app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/bitsov-app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/konsensus"
          shopt -s nullglob
          images=("$bundle"/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          dmg="${images[0]}"
          hdiutil verify "$dmg"
          if [ "$mode" = signed-notarized ]; then
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            codesign --verify --strict "$dmg"
            # Tauri signs the DMG; submit and staple its own ticket as well.
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_PASSWORD" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          fi
          mkdir -p release-assets
          prefix="release-assets/BitSov-$RELEASE_VERSION-macos-universal-$mode"
          ditto -c -k --keepParent "$app" "$prefix.app.zip"
          cp "$dmg" "$prefix.dmg"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Sign updater archive / Signér opdateringsarkiv
        if: needs.prepare.outputs.updater == 'true'
        env:
          SIGNING_MODE: ${{ steps.bundle.outputs.mode }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/release-assets/BitSov-$RELEASE_VERSION-macos-universal-$SIGNING_MODE.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" \
            -C src-tauri/target/universal-apple-darwin/release/bundle/macos BitSov.app
          python3 scripts/ci/release.py sign-updater "$archive" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-macos
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows NSIS / Windows-installation
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Toolchains and verified sidecar / Værktøjer og verificeret nodebinær
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          npm ci --no-audit --no-fund
          npm run tauri -- icon src-tauri/icons/icon.png --output src-tauri/target/release-icons
          bash scripts/fetch-node-sidecar.sh
      - name: Build and sign when configured / Byg og signér efter opsætning
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $mode = python scripts/ci/release.py signing windows
          $config = @{ bundle = @{ icon = @('target/release-icons/icon.ico') } }
          $signArgs = @('--no-sign')
          $cert = $null
          $pfx = Join-Path $env:RUNNER_TEMP 'release-certificate.pfx'
          try {
            if ($mode -eq 'signed') {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
              $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
              if (-not $cert.HasPrivateKey) { throw 'Signing key missing / Signeringsnøgle mangler' }
              $config.bundle.windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
                tsp = $true
              }
              $signArgs = @()
            }
            $config | ConvertTo-Json -Depth 8 | Set-Content src-tauri/target/release-windows.conf.json
            npm run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis `
              --config src-tauri/target/release-windows.conf.json @signArgs -- --locked
            $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
            if ($installers.Count -ne 1) { throw 'Expected one NSIS installer / Forventede ét NSIS-installationsprogram' }
            if ($mode -eq 'signed') {
              foreach ($file in @($installers[0].FullName, 'src-tauri/target/x86_64-pc-windows-msvc/release/bitsov-app.exe')) {
                if ((Get-AuthenticodeSignature $file).Status -ne 'Valid') {
                  throw 'Authenticode verification failed / Authenticode-verifikation mislykkedes'
                }
              }
            }
            New-Item -ItemType Directory -Force release-assets | Out-Null
            Copy-Item $installers[0].FullName "release-assets/BitSov-$env:RELEASE_VERSION-windows-x86_64-$mode-setup.exe"
          } finally {
            if ($cert) { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey }
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
            Remove-Item src-tauri/target/release-windows.conf.json -Force -ErrorAction SilentlyContinue
          }
      - name: Sign updater installer / Signér opdateringsinstallation
        if: needs.prepare.outputs.updater == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          installers=(release-assets/*-setup.exe)
          test "${#installers[@]}" -eq 1
          python scripts/ci/release.py sign-updater "${installers[0]}" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android release APK / Android-udgivelses-APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - name: Toolchains / Værktøjer
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
          test -d "$ANDROID_NDK_HOME"
          printf 'NDK_HOME=%s\n' "$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          npm ci --no-audit --no-fund
      - name: Build release APK / Byg udgivelses-APK
        run: |
          set -euo pipefail
          npm run tauri -- android build --ci --apk --target aarch64 -- --locked
          python3 scripts/check-android-release.py --generated
      - name: Align and sign when configured / Justér og signér efter opsætning
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mode="$(python3 scripts/ci/release.py signing android)"
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release-unsigned.apk')
          test "${#apks[@]}" -eq 1
          tools="$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p release-assets
          output="release-assets/BitSov-$RELEASE_VERSION-android-arm64-$mode.apk"
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$output"
          if [ "$mode" = signed ]; then
            keystore="$RUNNER_TEMP/release-keystore.jks"
            trap 'rm -f "$keystore"' EXIT
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'release-keystore.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
            "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD "$output"
            "$tools/apksigner" verify "$output"
          fi
          "$tools/zipalign" -c -P 16 4 "$output"
          # apksigner's optional incremental-install .idsig is not a release asset.
          rm -f "$output.idsig"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-platform-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Verify complete artifact set / Verificér alle udgivelsesfiler
    needs: [prepare, macos, windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      UPDATER: ${{ needs.prepare.outputs.updater }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-platform-*
          merge-multiple: true
          path: release-assets
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.prepare.outputs.updater == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Validate artifacts and make updater manifest / Validér filer og opret opdateringsmanifest
        run: |
          set -euo pipefail
          args=()
          if [ "$UPDATER" = true ]; then args+=(--updater); fi
          python3 scripts/ci/release.py assemble release-assets "$RELEASE_VERSION" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "${args[@]}"
      - name: Install updater signer / Installér opdateringssignering
        if: needs.prepare.outputs.updater == 'true'
        run: npm ci --no-audit --no-fund
      - name: Sign manifest / Signér manifest
        if: needs.prepare.outputs.updater == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/ci/release.py sign-updater release-assets/latest.json "$RELEASE_VERSION"
      - name: SHA256SUMS
        run: |
          python3 scripts/ci/release.py checksums release-assets
          cd release-assets
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft GitHub Release / GitHub-udgivelseskladde
    needs: [prepare, macos, windows, android, assemble]
    if: needs.prepare.outputs.dry-run == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release-assets
      - name: Publish draft with all artifacts / Opret kladde med alle udgivelsesfiler
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "BitSov $RELEASE_TAG" --notes \
            'EN: Draft for review. Signing status is in each artifact name. Verify SHA256SUMS before use.

          DA: Kladde til gennemgang. Signeringsstatus står i hvert filnavn. Verificér SHA256SUMS før brug.'
