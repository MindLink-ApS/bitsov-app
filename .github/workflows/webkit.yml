name: WebKit

# Atlas should make "WebKit (safe areas + type + keyboard)" required on main.
# No workflow path filters: even non-UI PRs receive a successful check.
# Use full-ci to force tests for changes outside the UI paths below.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webkit:
    name: WebKit (safe areas + type + keyboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Detect UI changes
        id: changes
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci')
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Only an explicit false skips tests; missing output or errors run them.
          # Compare from the merge base, and include both sides of renames.
          if ! git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/webkit-changed-files"; then
            echo "::warning::Unable to detect changed files; running WebKit."
            exit 0
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              src/*|index.html|public/*|tests/*webkit*|playwright*.config.ts|package*.json|.github/workflows/webkit.yml)
                echo "UI changes detected; running WebKit."
                exit 0
                ;;
            esac
          done < "$RUNNER_TEMP/webkit-changed-files"
          echo "No UI changes detected; skipping WebKit setup, install and tests."
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.changes.outputs.run != 'false'
        with:
          node-version: 22
          cache: npm
      - name: Install locked frontend dependencies
        if: steps.changes.outputs.run != 'false'
        run: npm ci --no-audit --no-fund
      - name: Install WebKit and Linux dependencies
        if: steps.changes.outputs.run != 'false'
        run: npx playwright install --with-deps webkit
      - name: Safe areas, Dynamic Type, keyboard and inputs
        if: steps.changes.outputs.run != 'false'
        run: npm run test:webkit
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webkit-failures
          path: test-results/webkit/
          retention-days: 7
