name: iOS Preview

# One unsigned iOS Simulator app (arm64) per change, for checking the iPhone and
# iPad UI in Xcode's Simulator. No device build, signing, provisioning,
# notarization or repository secrets: a Simulator app needs none of them.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'public/**'
      - 'third_party/fonts/**'
      - 'index.html'
      - 'assistant.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/ios-preview.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-preview:
    name: iOS Simulator preview (unsigned app; not a merge gate)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: tauri-preview-ios-sim-arm64
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      # A Simulator build is not code signed; the checked-in Xcode project is used
      # as is (tauri merges Info.ios.plist into the bundle's Info.plist).
      - name: Build iOS Simulator preview
        run: npm run tauri -- ios build --ci --debug --target aarch64-sim
      - name: Pack the preview app
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(src-tauri/gen/apple/build/arm64-sim/*.app)
          test "${#apps[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/preview"
          # ditto keeps the bundle's structure and attributes; drag the unzipped
          # app onto a booted Simulator, or: xcrun simctl install booted BitSov.app
          ditto -c -k --keepParent "${apps[0]}" "$RUNNER_TEMP/preview/BitSov-preview-ios-simulator-arm64-$PREVIEW_SHA.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitsov-preview-ios-simulator-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/preview/*-preview-*.zip
          if-no-files-found: error
          retention-days: 3
