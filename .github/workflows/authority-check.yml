name: Authority Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authority-check:
    name: Authority Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run app authority gate
        run: scripts/authority-check.sh

      - name: Test source gate with a downloaded sidecar present
        run: bash scripts/test-authority-source.sh

      # app #16. The source-guard layer needs no bundle and no macOS: it asserts the
      # run loop still handles BOTH RunEvent variants, that teardown never hunts a
      # port, and that SIGTERM precedes SIGKILL. The live-bundle layer skips here and
      # runs on macOS with a built .app.
      - name: App lifecycle guards (quit must stop the owned node)
        run: bash scripts/test-app-lifecycle.sh

      # Behavioural coverage of the stop policy itself: ordering, the timeout
      # escalation, and the two never-signal cases. Text guards cannot prove these.
      - name: Stop-policy behaviour tests
        working-directory: src-tauri
        run: cargo test --locked stop_policy_tests
