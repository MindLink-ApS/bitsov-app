name: Authority Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; never cancel a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authority-check:
    name: Authority Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run app authority gate
        run: scripts/authority-check.sh

      - name: Test source gate with a downloaded sidecar present
        run: bash scripts/test-authority-source.sh

      # Fake bundle trees only; no build, no network. The real bundle is checked
      # by the Mac Package workflow.
      - name: Mac bundle checker tests
        run: |
          shellcheck scripts/package-mac.sh scripts/check-mac-bundle.sh scripts/test-check-mac-bundle.sh
          bash scripts/test-check-mac-bundle.sh
          python3 scripts/test-package-mac.py

      # app #16. The source-guard layer needs no bundle and no macOS: it asserts the
      # run loop still handles BOTH RunEvent variants, that teardown never hunts a
      # port, and that SIGTERM precedes SIGKILL. The live-bundle layer skips here and
      # runs on macOS with a built .app.
      - name: App lifecycle guards (quit must stop the owned node)
        run: bash scripts/test-app-lifecycle.sh
