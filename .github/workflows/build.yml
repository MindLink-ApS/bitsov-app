name: Build

# Compile gate. Authority Check only greps source text; this job proves the app actually
# builds: TypeScript type-check + Vite bundle, then `cargo check` and `cargo test` on the
# Tauri crate. Make it a REQUIRED status on main so review happens on a compiled SHA, not
# on greps.
#
# CI cost (private repo, minutes are billed):
# - A newer push to the same PR cancels the older run. Pushes, tags, and merge-queue
#   runs are not cancelled.
# - Docs-only and `pm/` pulls skip the heavy jobs. `Authority Check` has no `if` and
#   is the cheap check that always completes. This workflow does not use
#   pull_request paths-ignore: a skipped workflow never reports, and a required
#   `Build (tsc + vite + cargo check)` would stay pending.
# - macOS bundles run nightly, on `v*` tags, or for `full-ci` (mac-package.yml).
#   Windows and Android previews run on relevant PRs or workflow_dispatch
#   (windows-compile.yml, android-preview.yml). There is no iOS simulator job;
#   `cargo check --features mobile` below stays on every code PR.
# - Android Rust gets one cached ARM64 cross-check on relevant PRs only. It uses
#   the runner's NDK, without Gradle, an APK, or a target matrix.
# - The sidecar job is not a merge gate. It waits for this job and reuses the same
#   Rust cache instead of compiling the crate a second time in parallel.
on:
  pull_request:
    branches: [main]
    # No paths-ignore. No `labeled`: adding `merge-ready` must not rebuild.
    # `full-ci` is read on the next synchronize (and on macOS immediately).
  push:
    branches: [main]
    tags: ['v*']
    # No push paths filter (Atlas ruling 20 Oct): every push to main builds, so
    # main's status always reflects a compiled tree. PRs still skip heavy jobs
    # for docs-only changes at the job level.
  merge_group:

# contents: read only. Do not grant actions: write or issues: write here:
# pull-request code runs in this workflow, and a write token can publish a
# poisoned Actions cache or create labels. The `full-ci` label already exists.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs; never cancel a push, tag, or merge-queue run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # File list for a pull request. Not granted to the jobs that compile.
      pull-requests: read
    outputs:
      # Pushes, tags, and merge-queue runs always build. A PR builds when any
      # changed file is outside the docs/`pm/` set, or when it carries `full-ci`.
      # Non-pull_request events do not read steps.filter: that step is skipped
      # and this expression is already true.
      code: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || steps.filter.outputs.code == 'true' }}
      android: ${{ steps.filter.outputs.android }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
    steps:
      # pull_request only. paths-filter reads the PR file list from the API.
      # On push and merge_group it needs a checkout, which this job does not
      # have, and the step fails. Those events run every heavy job via the
      # output above.
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # paths-filter defaults to 'some': a file matches a filter if it
          # matches ANY pattern, so the '**' entry would make every PR code=true.
          # With 'every', a file matches only if it matches ALL patterns: '**'
          # and none of the negated docs-only patterns. The filter is true when
          # at least one changed file matches, i.e. when anything outside the
          # docs-only set changed.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!pm/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.gitignore'
              - '!CODEOWNERS'
            # One brace pattern because predicate-quantifier is 'every'.
            # src-tauri/** includes the generated Android project.
            android:
              - '{src-tauri/**,scripts/check-android-release.py,.github/workflows/build.yml}'
            # Includes bootstrap/config sources, lockfiles, release pins, smoke
            # scripts and CI plumbing. A failed classifier still runs Sidecar.
            sidecar:
              - '{src-tauri/**,scripts/fetch-node-sidecar*,scripts/*sidecar*,scripts/test-fetch-verify.sh,scripts/cs[12]*,scripts/ci/**,.github/actions/**,.github/workflows/build.yml}'

  android-check:
    name: Android Rust (aarch64 cargo check)
    needs: changes
    # Fail closed if classification fails; skip unrelated PRs and non-PR events.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Configure the preinstalled Android NDK
        run: |
          TOOLCHAIN="${ANDROID_NDK_HOME:?}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # API 24 matches gen/android/app/build.gradle.kts minSdk.
          test -x "$TOOLCHAIN/aarch64-linux-android24-clang"
          test -x "$TOOLCHAIN/llvm-ar"
          {
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-android-check
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      # Real target cfg selects the mobile code without the host-only mobile
      # feature. Limit workspace selection to the app, not the desktop FFI crate.
      # --tests type-checks tests; it neither links nor runs Android binaries.
      - name: Rust — Android library and tests
        working-directory: src-tauri
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/src-tauri/gen/android
          WRY_ANDROID_PACKAGE: tech.mindlink.bitsov
          WRY_ANDROID_LIBRARY: bitsov_app
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/src-tauri/gen/android/app/src/main/java/tech/mindlink/bitsov/generated
        run: |
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          # Tauri's build script does not track TAURI_ANDROID_PROJECT_PATH.
          # Regenerate even when a pre-slice cache has no emitted rules.
          cargo clean -p tauri --target aarch64-linux-android
          cargo check --locked -p bitsov-app --target aarch64-linux-android --lib --tests

      # Inspect rules emitted by the locked dependency, without Gradle/SDK/APK.
      # Missing generated output fails rather than silently skipping the check.
      - name: Android release — keep rules and safe defaults
        run: python3 scripts/check-android-release.py --generated

  build:
    name: Build (tsc + vite + cargo check)
    needs: changes
    # A skipped job reports success under branch protection, so this required
    # check is skipped only when classification succeeded and found docs-only
    # changes. Any other `changes` result fails closed and runs the job.
    # `!cancelled()` (not `always()`) bypasses the implicit success() while
    # still letting PR concurrency cancel this job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    # A Build job hung for 6 h on 30 Sep (app #131); a normal run is well under this.
    timeout-minutes: 30
    # `debug = 0` is debuginfo, not debug assertions. `cfg(debug_assertions)` stays
    # on. Smaller objects keep the link off the disk ceiling (ld SIGBUS, 1 Oct)
    # and make the restored cache smaller. Incremental is off because sccache
    # plus a restored target/ replaces it.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      # Free runner disk (toolchains this job never uses) so the link step has room.
      - name: Free disk space
        run: bash scripts/ci/free-disk-space.sh

      # Unit test of THIS repo's fail-closed signature predicate (scripts/fetch-node-sidecar.sh
      # verify_release_signature): local throwaway keys, no network, no release dependency.
      # Proves revoked / expired keys, expired or bad signatures and missing keys are refused
      # even though GnuPG still emits VALIDSIG for several of them.
      - name: Unit test — fetch script signature predicate (no network)
        run: |
          bash scripts/test-fetch-verify.sh
          python3 scripts/test-verify-sidecars.py

      # Static renderer/host security checks must run on every code PR even
      # when the network-dependent Sidecar job is outside its path filter.
      - name: CS-2 smoke — host bindings and renderer security
        run: bash scripts/cs2-local-smoke.sh

      - name: Cached apt archive verification tests
        run: python3 scripts/ci/test-verify-apt-cache.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend — tsc --noEmit && vite build
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Tauri v2 Linux prerequisites. `cargo check` still runs the gtk/webkit -sys build
      # scripts, which resolve these via pkg-config.
      - name: Tauri Linux prerequisites
        timeout-minutes: 5
        uses: ./.github/actions/tauri-prerequisites

      - uses: dtolnay/rust-toolchain@stable

      # Cache registry crates and path crates (src-tauri/ffi, src-tauri/crates/mock-node).
      # The default rust-cache mode skips workspace crates, so a lockfile-stable
      # PR still recompiled them. There is no vendor/ tree in this repo; the
      # flag is what covers one if it is added.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-dev
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          # The explicit stats step below is best-effort, including on startup failure.
          disable_annotations: true

      - name: Enable sccache for Cargo
        run: |
          # Cache outages must cost time, not fail the build (app #280).
          # Keep the probed server alive; restarting during an outage can fail.
          export SCCACHE_IDLE_TIMEOUT=0
          export SCCACHE_GHA_ENABLED=true
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable; compiling without a cache"
          fi

      # tauri_build validates that bundle.externalBin (bin/konsensus-<triple>) EXISTS at check
      # time. This gate must prove OUR Rust compiles without depending on a genome release
      # download (network, release availability), so satisfy that check with an empty CI-only
      # placeholder. The REAL signed sidecar is fetched by scripts/fetch-node-sidecar.sh — see
      # the `sidecar` job below, the smoke, and `tauri build`; bin/konsensus-* is gitignored and
      # never committed.
      - name: Placeholder for the tauri_build externalBin existence check (cargo check only)
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/bin
          : > "src-tauri/bin/konsensus-${TRIPLE}"

      - name: Rust — cargo check (src-tauri)
        working-directory: src-tauri
        run: cargo check --locked

      - name: Rust — host mobile check (src-tauri)
        working-directory: src-tauri
        run: cargo check --locked --features mobile --tests

      # One test invocation. `stop_adapter_tests` is `cfg(not(feature = "mobile"))`
      # and these features do not enable `mobile`, so the old extra
      # `cargo test stop_adapter_tests` compiled and ran that module twice.
      - name: Rust — cargo test (src-tauri)
        working-directory: src-tauri
        run: cargo test --locked --features dev-node,local-owner-ceremony

      - name: Disk after tests
        if: always()
        run: df -h /

      # The debug app with `sit-mock` hands the mock rows to the sealed
      # assistant window. Compile that path so it cannot rot.
      - name: Rust — cargo check with sit-mock (src-tauri)
        working-directory: src-tauri
        run: cargo check --locked --features sit-mock --bins --examples

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  starter-balance:
    name: Starter balance enabled (build + tests)
    needs: changes
    # CI-DIET B (Atlas approved): PR/full-ci, tags and merge groups retain
    # coverage; starter-balance-nightly.yml checks main nightly when changed.
    # Revert B and its nightly follow-up together to restore every-main-push runs.
    if: >-
      ${{ !cancelled() && !(github.event_name == 'push' && github.ref == 'refs/heads/main') &&
          (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_STARTER_BALANCE: "1"
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend — build and test with starter balance enabled
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx vitest run
      - name: Free disk space if needed
        run: bash scripts/ci/free-disk-space.sh
      - name: Tauri Linux prerequisites
        timeout-minutes: 5
        uses: ./.github/actions/tauri-prerequisites
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-starter-enabled
          cache-all-crates: "true"
          cache-workspace-crates: "true"
      - name: Rust — build and test with starter balance enabled
        working-directory: src-tauri
        run: |
          cargo test --locked --lib
          cargo test --locked --test '*' --no-fail-fast

  # NOT a merge gate: keep this job OUT of the required status checks. It depends on the
  # genome's published release and on network, not on this repo's source. It exercises the
  # REAL sidecar path end to end against the pinned release: download, fail-closed signature
  # verification (RELEASE_KEY.asc from the genome's main, imported into a throwaway keyring,
  # fingerprint pinned), sha256 check against the signed SHA256SUMS, a bootstrap config
  # drift guard, then the CS-1 smoke boots
  # the fetched node exactly as `init` configured it — zero port or migrations edits — and
  # proves the identity is durable across a restart.
  #
  # It used to compile the same crate in parallel with `build` (its own actions/cache
  # key). It now waits for that job and restores the same rust-cache. PRs run it
  # for sidecar paths or full-ci; pushes/tags and merge groups keep their coverage.
  # The job name is unchanged.
  sidecar:
    name: Sidecar (fetch + verify, config drift, CS-1 smoke) — not a merge gate
    needs: [changes, build]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (github.event_name != 'pull_request' ||
           contains(github.event.pull_request.labels.*.name, 'full-ci') ||
           needs.changes.result != 'success' || needs.changes.outputs.sidecar == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Fetch + verify the pinned signed node (throwaway keyring)
        run: |
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          bash scripts/fetch-node-sidecar.sh
          bash scripts/fetch-node-sidecar.sh --verify-only
          SIDECAR="src-tauri/bin/konsensus-x86_64-unknown-linux-gnu"
          test -x "$SIDECAR"
          "$SIDECAR" --version

      # The drift guard links the same large Tauri test binary as the Build job.
      - name: Free disk space before restoring the Rust cache
        run: bash scripts/ci/free-disk-space.sh

      - name: Tauri Linux prerequisites for the config drift guard
        timeout-minutes: 5
        uses: ./.github/actions/tauri-prerequisites

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-dev
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          # The explicit stats step below is best-effort, including on startup failure.
          disable_annotations: true

      - name: Enable sccache for Cargo
        run: |
          # Cache outages must cost time, not fail the build (app #280).
          # Keep the probed server alive; restarting during an outage can fail.
          export SCCACHE_IDLE_TIMEOUT=0
          export SCCACHE_GHA_ENABLED=true
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable; compiling without a cache"
          fi

      # Runs on sidecar changes, including edits to fetch-node-sidecar.sh's TAG.
      # Explicit discovery makes a missing verified binary FAIL rather than SKIP.
      # rc19.2 supplies both init and the two-phase owner API.
      - name: Bootstrap config matches the pinned node's full-tier init
        working-directory: src-tauri
        env:
          BITSOV_OWNER_TEST_BINARY: ${{ github.workspace }}/src-tauri/bin/konsensus-x86_64-unknown-linux-gnu
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        # The host lives in the lib since the mobile split; --bin would match nothing and pass.
        # Fail unless exactly one test actually ran.
        run: |
          set -o pipefail
          cargo test --locked --features dev-node,local-owner-ceremony --lib \
            app::local_owner::config_tests::bootstrap_config_matches_node_init -- --exact --nocapture 2>&1 | tee /tmp/owner-test.log
          grep -q "running 1 test" /tmp/owner-test.log || { echo "::error::expected exactly 1 test to run"; exit 1; }

      - name: rc19.2 owner create, finalize and restart lifecycle (verified sidecar)
        working-directory: src-tauri
        env:
          BITSOV_OWNER_TEST_BINARY: ${{ github.workspace }}/src-tauri/bin/konsensus-x86_64-unknown-linux-gnu
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        # The host lives in the lib since the mobile split; --bin would match nothing and pass.
        # Fail unless exactly one test actually ran.
        run: |
          set -o pipefail
          cargo test --locked --features dev-node,local-owner-ceremony --lib \
            app::local_owner::process_tests::real_node_create_finalize_restart_lists_device -- --exact --nocapture 2>&1 | tee /tmp/owner-test.log
          grep -q "running 1 test" /tmp/owner-test.log || { echo "::error::expected exactly 1 test to run"; exit 1; }

      # Evidence for BitSov-bitsov #66, never a gate: show what THIS runner gets from the two
      # public fee-estimate endpoints (status, headers, first bytes) so a boot failure below can
      # be read against the actual responses instead of guessed at.
      - name: Chain endpoint diagnostics (evidence for #66; never fails the job)
        run: |
          for u in https://mempool.space/api/fee-estimates https://blockstream.info/api/fee-estimates; do
            echo "=== GET $u ==="
            curl -sS -m 8 -D - "$u" -o body.tmp || echo "(curl failed: $?)"
            head -c 400 body.tmp 2>/dev/null; echo; rm -f body.tmp
          done || true

      # rc7 fixes #66 at the node: fresh init writes the provider pair and the
      # probe validates fee data. Test those defaults with NO endpoint override.
      - name: CS-1 smoke — boot rc19.2 from untouched init defaults, durable identity
        run: bash scripts/cs1-local-smoke.sh

      - name: CS-2 smoke — rc19.2 host bindings
        run: bash scripts/cs2-local-smoke.sh

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
