name: Windows Tests

# Native Windows run of the Rust unit tests, including the private-file layer
# and the DPAPI sealer, which were only type-checked before. Not a merge gate
# yet: it starts informational until it has a green baseline on main.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/windows-tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-tests:
    name: Windows native Rust tests — not a merge gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # generate_context! needs the built frontend.
      - name: Frontend build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: windows-tests
      # tauri_build checks that bundle.externalBin exists; tests never run it.
      - name: Placeholder for the externalBin existence check
        shell: bash
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/bin
          : > "src-tauri/bin/konsensus-${TRIPLE}.exe"
      # Tests that need an unelevated process return early when elevated, so
      # record the integrity level the tests run at.
      - name: Process integrity level
        shell: pwsh
        run: |
          $groups = whoami /groups
          if ($groups -match 'S-1-16-12288') { 'integrity: high (elevated)' } elseif ($groups -match 'S-1-16-8192') { 'integrity: medium (not elevated)' } else { 'integrity: unknown' }
      # Test executables need the Common Controls v6 manifest that tauri_build
      # embeds only into the app executable. Applied to this job's links only.
      - name: Private-file layer and DPAPI (bitsov-ffi)
        working-directory: src-tauri
        env:
          RUSTFLAGS: -C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:${{ github.workspace }}\scripts\ci\windows-test.manifest
        run: cargo test --locked -p bitsov-ffi
      - name: App library tests
        working-directory: src-tauri
        env:
          RUSTFLAGS: -C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:${{ github.workspace }}\scripts\ci\windows-test.manifest
        run: cargo test --locked -p bitsov-app --lib
