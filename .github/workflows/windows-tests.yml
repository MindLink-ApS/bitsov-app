name: Windows Tests

# Native Windows run of the private-file layer, the DPAPI sealer and the
# Windows store tests, which were only type-checked before, as a standard
# (not elevated) user. The full app suite is not run here yet: most of it
# was written for Unix. Not a merge gate until it has a green baseline.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/windows-tests.yml'
      - 'scripts/ci/windows-test.manifest'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-tests:
    name: Windows native Rust tests — not a merge gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # generate_context! needs the built frontend.
      - name: Frontend build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: windows-tests
      # tauri_build checks that bundle.externalBin exists; tests never run it.
      - name: Placeholder for the externalBin existence check
        shell: bash
        run: |
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/bin
          : > "src-tauri/bin/konsensus-${TRIPLE}.exe"
      # Hosted runners are elevated, and the private-file layer refuses an
      # elevated process (its store tests then return early and prove nothing).
      # Build the test executables here, then run the private-file layer and
      # the Windows store tests as a standard user (medium integrity).
      # Test executables also need the Common Controls v6 manifest that
      # tauri_build embeds only into the app executable (link time, this job only).
      - name: Build test executables
        working-directory: src-tauri
        shell: bash
        env:
          RUSTFLAGS: -C link-arg=/MANIFEST:EMBED -C link-arg=/MANIFESTINPUT:${{ github.workspace }}\scripts\ci\windows-test.manifest
        run: |
          set -euo pipefail
          sel='select(.profile.test == true and .executable != null) | .executable'
          cargo test --locked -p bitsov-ffi --no-run --message-format=json | jq -r "$sel" > "$RUNNER_TEMP/ffi-tests.txt"
          cargo test --locked -p bitsov-app --lib --no-run --message-format=json | jq -r "$sel" > "$RUNNER_TEMP/app-tests.txt"
          cat "$RUNNER_TEMP/ffi-tests.txt" "$RUNNER_TEMP/app-tests.txt"
      - name: Windows store tests as a standard user (not elevated)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'C:\bitsov-tests'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $ffi = @(Get-Content "$env:RUNNER_TEMP\ffi-tests.txt")
          $app = @(Get-Content "$env:RUNNER_TEMP\app-tests.txt")
          foreach ($e in $ffi + $app) { Copy-Item $e $dir }
          Get-ChildItem src-tauri\target\debug -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $dir
          Get-ChildItem src-tauri\target\debug\deps -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $dir
          # The test user is not an administrator, so it needs write access here
          # for its outputs (Users: modify).
          icacls $dir /grant '*S-1-5-32-545:(OI)(CI)M' | Out-Null
          # Hosted runners run with UAC off, so every token derived from the
          # runner's administrator account (runas /trustlevel included) still
          # reports TokenElevation = 1. A second account started from the
          # runner's own session cannot initialise user32 on that desktop.
          # A scheduled task gives the second account its own batch logon,
          # window station and profile: a standard user, not elevated.
          # The credential is random, never printed, and lives only on this runner.
          $bytes = [byte[]]::new(24)
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $plain = [Convert]::ToBase64String($bytes) + 'a1!'
          $testUser = 'bitsovtest'
          New-LocalUser -Name $testUser -Password (ConvertTo-SecureString $plain -AsPlainText -Force) `
            -PasswordNeverExpires -AccountNeverExpires | Out-Null
          # Performance Log Users (S-1-5-32-559) holds the batch logon right by
          # default and no administrative rights.
          Add-LocalGroupMember -SID 'S-1-5-32-559' -Member $testUser
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 25) -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
          function Run-Limited([string]$exe, [string]$argline, [string]$name) {
            $out = Join-Path $dir "$name.out"
            $done = Join-Path $dir "$name.done"
            $wrapper = Join-Path $dir "$name.cmd"
            Remove-Item $out, $done -ErrorAction SilentlyContinue
            Set-Content -Encoding ascii $wrapper @(
              '@echo off',
              "cd /d `"$dir`"",
              "`"$exe`" $argline > `"$out`" 2>&1",
              "echo %ERRORLEVEL%> `"$done`"")
            $task = "bitsov-test-$name"
            $action = New-ScheduledTaskAction -Execute "$env:SystemRoot\System32\cmd.exe" -Argument "/c `"$wrapper`""
            Register-ScheduledTask -TaskName $task -Action $action -Settings $settings `
              -User $testUser -Password $plain -RunLevel Limited -Force | Out-Null
            Start-ScheduledTask -TaskName $task
            # The marker appears before its exit code is written: wait for content.
            $waited = 0
            $text = $null
            while ($waited -lt 1500) {
              if (Test-Path $done) { $text = Get-Content $done -Raw -ErrorAction SilentlyContinue }
              if ($text -and $text.Trim()) { break }
              Start-Sleep -Seconds 2; $waited += 2
            }
            $info = Get-ScheduledTaskInfo -TaskName $task -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $task -Confirm:$false -ErrorAction SilentlyContinue
            if (Test-Path $out) { Get-Content $out }
            if (-not ($text -and $text.Trim())) {
              "$name did not finish within $waited s (task result 0x{0:X8})" -f [int]$info.LastTaskResult
              return 1
            }
            $code = [int]$text.Trim()
            "$name exit code: $code (0x{0:X8})" -f $code
            return $code
          }
          # The tests must not run elevated, or the store tests skip themselves.
          # The private-file layer's gate reads TokenElevation, so check exactly
          # that from inside the test user's process (and record its groups).
          $null = Run-Limited "$env:SystemRoot\System32\whoami.exe" '/groups' 'whoami'
          $check = Join-Path $dir 'elevation-check.ps1'
          Set-Content -Encoding ascii $check @(
            'Add-Type -TypeDefinition @"',
            'using System; using System.Runtime.InteropServices;',
            'public static class TokenCheck {',
            '  [DllImport("kernel32.dll")] static extern IntPtr GetCurrentProcess();',
            '  [DllImport("advapi32.dll", SetLastError = true)] static extern bool OpenProcessToken(IntPtr p, uint access, out IntPtr token);',
            '  [DllImport("advapi32.dll", SetLastError = true)] static extern bool GetTokenInformation(IntPtr token, int cls, out int value, int length, out int returned);',
            '  public static int Elevated() {',
            '    IntPtr token; if (!OpenProcessToken(GetCurrentProcess(), 8, out token)) return -1;',
            '    int value, returned; if (!GetTokenInformation(token, 20, out value, 4, out returned)) return -2;',
            '    return value;',
            '  }',
            '}',
            '"@',
            '"elevated=$([TokenCheck]::Elevated())"')
          $null = Run-Limited "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" "-NoProfile -ExecutionPolicy Bypass -File `"$check`"" 'elevation'
          $elevation = (Get-Content (Join-Path $dir 'elevation.out') -Raw).Trim()
          if ($elevation -ne 'elevated=0') { throw "the test user's process is still elevated ($elevation)" }
          'test user: not elevated (TokenElevation = 0)'
          $failed = 0
          foreach ($e in $ffi) {
            $name = 'ffi-' + [IO.Path]::GetFileNameWithoutExtension($e)
            $code = Run-Limited (Join-Path $dir ([IO.Path]::GetFileName($e))) '--test-threads=1' $name
            if ($code -ne 0) { $failed++ }
          }
          $filters = '--test-threads=1 budget::tests::windows_store spend_journal::windows_journal_tests ' +
                     'pairing::windows_store_tests trust::windows_store_tests app::windows_ai_storage_tests'
          foreach ($e in $app) {
            $name = 'app-' + [IO.Path]::GetFileNameWithoutExtension($e)
            $code = Run-Limited (Join-Path $dir ([IO.Path]::GetFileName($e))) $filters $name
            if ($code -ne 0) { $failed++ }
          }
          if ($failed -ne 0) { throw "$failed test executable(s) failed" }
