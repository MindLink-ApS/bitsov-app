name: Mac Package

# Unsigned Apple Silicon BitSov.app (+ .dmg) as a short-lived CI artifact
# (docs/MAC_PACKAGE.md). No secrets, no signing, no notarization, no release.
# The built app is never opened or executed here.
#
# NOT a merge gate: keep this job OUT of the required status checks. Like the
# Build workflow's `sidecar` job it depends on network and on the genome's
# published rc13 release, not only on this repo's source.
#
# CI cost rule (app #131): macOS runners bill at 10x Linux, so this runs once per
# change: on push to main (after merge) and on workflow_dispatch. On a PR it runs
# only when the `full-ci` label is added; carrying the label does not enable runs
# on later pushes, so remove and re-add it to request another run. It no longer
# runs on PR opened / ready_for_review (that billed every change twice).
# Required gates (Authority Check, Build) are unaffected.
on:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Label-triggered: adding any other label (e.g. merge-ready) starts a run that
  # the job `if` skips, so never cancel an in-flight run here.
  cancel-in-progress: false

jobs:
  mac-package:
    name: Mac package (unsigned .app artifact) — not a merge gate
    runs-on: macos-14
    # See the CI cost rule at the top of this file.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'full-ci'
    timeout-minutes: 45
    env:
      # scripts/fetch-node-sidecar.sh reads the pinned public release with gh.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: GnuPG for the sidecar signature check
        run: command -v gpg || brew install gnupg

      - name: Unit test — bundle checker (no network)
        run: |
          bash scripts/test-check-mac-bundle.sh
          python3 scripts/test-verify-sidecars.py
          python3 scripts/test-package-mac.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-

      - name: Fetch and re-verify every sidecar against rc13 (G1)
        run: |
          bash scripts/fetch-node-sidecar.sh
          bash scripts/fetch-node-sidecar.sh --verify-only

      # Existing files are re-verified by both the package script and Tauri's
      # beforeBundleCommand; this flag skips only the binary download.
      - name: Package (unsigned) and check
        run: bash scripts/package-mac.sh --dmg --use-existing-sidecar

      - name: Zip the .app
        run: |
          set -euo pipefail
          bash scripts/fetch-node-sidecar.sh --verify-only
          bash scripts/check-mac-bundle.sh
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/BitSov.app \
            "$RUNNER_TEMP/out/BitSov-unsigned-macos-arm64.app.zip"
          cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: bitsov-unsigned-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7
