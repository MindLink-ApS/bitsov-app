name: Mac Package

# Ad-hoc signed Apple Silicon BitSov.app (+ .dmg) as a short-lived CI artifact
# (docs/MAC_PACKAGE.md). No secrets, Developer ID, notarization or release.
# The built executable runs only its headless storage smoke mode.
#
# NOT a merge gate: keep this job OUT of the required status checks. Like the
# Build workflow's `sidecar` job it depends on network and on the genome's
# published release, not only on this repo's source.
#
# CI resource use (app #131):
# This Tauri bundle does not run on pull-request pushes or on every push to
# main. It runs on the nightly schedule (default branch), on `v*` tags, on
# workflow_dispatch, and on a PR when `full-ci` is added or a full-ci PR gets a
# new commit. Adding any other label (e.g. merge-ready) does not rebuild.
# There is no iOS simulator / `tauri ios build` workflow on this repo. The
# Linux Build job still runs `cargo check --features mobile` on every code PR.
# Do not add an xcodebuild on macos-14 to the per-PR path; an iOS bundle
# belongs on these same triggers.
on:
  schedule:
    # Once a day on the default branch. 05:00 UTC, clear of the 06:00 audit.
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    # `synchronize` makes `full-ci` stick for later pushes. Other PRs hit the
    # job `if` and do not start a runner.
    types: [labeled, synchronize, reopened]

# contents: read only. A full-ci pull request runs this job; do not grant
# actions: write to that token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new commit on a full-ci PR cancels the previous bundle. Adding another
  # label must not cancel an in-flight bundle (cancel-in-progress stays false
  # for `labeled`). Pushes, tags and the nightly are not cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  mac-package:
    name: Mac package (ad-hoc signed .app artifact) — not a merge gate
    runs-on: macos-14
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci') &&
       (github.event.action != 'labeled' || github.event.label.name == 'full-ci'))
    timeout-minutes: 45
    env:
      # scripts/fetch-node-sidecar.sh reads the pinned public release with gh.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: GnuPG for the sidecar signature check
        run: command -v gpg || brew install gnupg

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Release profile, separate from the Linux dev-test cache. Path crates
      # (ffi, mock-node) are included; there is no vendor/ tree today.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          shared-key: tauri-release-macos
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        continue-on-error: true
        with:
          # The explicit stats step below is best-effort, including on startup failure.
          disable_annotations: true

      - name: Enable sccache for Cargo
        run: |
          # Cache outages must cost time, not fail the build (app #280).
          # Keep the probed server alive; restarting during an outage can fail.
          export SCCACHE_IDLE_TIMEOUT=0
          export SCCACHE_GHA_ENABLED=true
          export SCCACHE_IGNORE_SERVER_IO_ERROR=1
          if sccache --start-server; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable; compiling without a cache"
          fi

      - name: Fetch and re-verify every sidecar against rc24 (G1)
        run: |
          bash scripts/fetch-node-sidecar.sh
          bash scripts/fetch-node-sidecar.sh --verify-only

      # Pure checks; the enclave probe is replaced, no Keychain or enclave use.
      - name: Secure storage bridge checks
        run: bash scripts/test-mac-secure-storage.sh

      # Existing files are re-verified by both the package script and Tauri's
      # beforeBundleCommand; this flag skips only the binary download.
      # The offline bundle-checker unit tests run on Linux in Authority Check.
      - name: Package, sign ad-hoc and verify
        run: bash scripts/package-mac.sh --beta --dmg --use-existing-sidecar

      - name: Real Keychain smoke from the signed bundle (headless)
        run: |
          set -euo pipefail
          app='src-tauri/target/release/bundle/macos/BitSov Beta.app'
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          "$app/Contents/MacOS/$executable" --keychain-smoke-test

      - name: Zip the .app
        run: |
          set -euo pipefail
          # The package script compares the authenticated sidecar BEFORE signing.
          # Re-signing changes its bytes; verify the sealed bundle before archiving.
          app='src-tauri/target/release/bundle/macos/BitSov Beta.app'
          test -s "$app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$app" \
            "$RUNNER_TEMP/out/BitSov-unsigned-macos-arm64.app.zip"
          cp src-tauri/target/release/bundle/dmg/*.dmg "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bitsov-unsigned-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
